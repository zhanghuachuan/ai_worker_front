# ==============================================================================
# ai_worker 前端 Nginx 配置 (conf.d 片段)
# 部署时会被复制到 /etc/nginx/conf.d/ai_worker.conf
# 端口 8094，与 simple_profile (端口 80) 互不干扰
# 功能: 前端静态文件 + API 反向代理到后端 8083
# ==============================================================================

server {
    listen 8094;
    server_name _;

    # 前端静态文件
    root /usr/local/app/ai_worker_front/dist;
    index index.html;

    # index.html 禁止缓存，确保浏览器总是获取最新版本
    # 避免缓存旧 index.html 引用已不存在的 JS 文件
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # SPA 路由: 所有非文件请求回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端
    location /api/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM 调用可能较慢，超时设为 5 分钟
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;
}
